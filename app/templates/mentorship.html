{% extends "base.html" %}
{% block title %}Mentorship{% endblock %}

{% block content %}
<section class="contact-page">
  <h2>Request or offer mentorship</h2>
  <p>Connect emerging artists with practitioners. Requests are reviewed by the site administrator.</p>
  <form method="post" novalidate>
    {{ form.hidden_tag() }}
    <label>{{ form.name.label.text }} {{ form.name(class="form-input") }}
      {% for error in form.name.errors %}<span class="form-error">{{ error }}</span>{% endfor %}
    </label>
    <label>{{ form.email.label.text }} {{ form.email(class="form-input") }}
      {% for error in form.email.errors %}<span class="form-error">{{ error }}</span>{% endfor %}
    </label>
    <label>{{ form.request_type.label.text }} {{ form.request_type(class="form-input") }}</label>
    <label>{{ form.focus_area.label.text }} {{ form.focus_area(class="form-input") }}</label>
    <label>{{ form.details.label.text }} {{ form.details(class="form-input") }}
      {% for error in form.details.errors %}<span class="form-error">{{ error }}</span>{% endfor %}
    </label>
    <input type="submit" value="Submit request" />
  </form>
</section>
{% endblock %}
